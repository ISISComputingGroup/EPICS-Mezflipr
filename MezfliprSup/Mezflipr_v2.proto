OutTerminator = LF;

Timeout = 100;

getCompensation {
    connect 500;
    out "compensation_current?";
    in "%f" LF;
    wait 500;
}

setCompensation {
    connect 500;
    out "compensation_current=%f";
    in "compensation_current=%*f" LF;
    wait 500;
}

getPower {
    connect 500;
    out "device_state?";
    in "%{off|on}" LF;
    wait 500;
}

setPower {
    connect 500;
    out "device_state=%{off|on}";
    in "device_state=%*{off|on}" LF;
    wait 500;
}

getParams {
    connect 500;
    out "flipper_params?";
    in "%#s";
    wait 500;
}

setCurrent {
    connect 500;
    out "flipper_current=%f";
    in "flipper_current=%*f" LF;
    wait 500;
}

setCurrentSteps {
    connect 500;
    out "flipper_steps=%s";
    in "flipper_steps=%*[^\n]" LF;
    wait 500;
}

setCurrentAnalytical {
    connect 500;
    out "flipper_analytical=%s";
    in "flipper_analytical=%*[^\n]" LF;
    wait 500;
}

setFile {
    connect 500;
    out "flipper_filename=%s";
    in "flipper_filename=%*[^\n]" LF;
    wait 500;
}

getMode {
    connect 500;
    out "mode?";
    in "%{static|steps|analytical|file}" LF;
    wait 500;
}
